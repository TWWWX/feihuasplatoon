# Cloudflare Worker：诗句词库校验 API
# 部署/开发均在项目根目录执行：npx wrangler dev / npx wrangler deploy
name = "feihua-poetry-api"
main = "worker/index.js"
compatibility_date = "2026-09-04"

[[d1_databases]]
binding = "DB"
database_name = "feihua-poetry"
# npx wrangler d1 create feihua-poetry 后，把输出中的 database_id 粘贴到这里
database_id = "a797ccd1-0839-435b-94a0-e364907348ee"
